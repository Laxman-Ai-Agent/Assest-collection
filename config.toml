# All settings live here. Code never hardcodes these values.

[paths]
assets = "visual-assets"          # relative to project root; move to another drive by changing this

[ranking]
exact_min = 0.30                   # CLIP score >= this  -> exact/
related_min = 0.22                 # CLIP score >= this  -> related/ ; below -> dropped

[quality]                          # photos below these are ignored (not applied to logos / screenshots / posts)
min_side = 720                     # shorter side in pixels (720 = HD)
min_sharpness = 250                # detail in the sharpest part; real photos >= ~350, blurry / upscaled <= ~170

[related]                          # after a search, search again with the titles of the best images found
queries = 2                        # extra related searches per run (0 = off); --related N overrides
per_query = 10                     # results per source for each related search
remember = 10                      # best titles kept as references for later searches with similar words

[cache]
search_ttl_days = 7                # reuse search results younger than this

[video]
max_height = 1080                  # download quality cap
max_duration_sec = 600             # skip longer videos (full movies etc.)
max_mb = 300                       # skip bigger files

[screenshot]
browser = "msedge"                 # Edge already on Windows; or "chrome"
width = 1920
height = 1080                      # 16:9, ready for video
scale = 1                          # 2 = sharper (3840x2160)
full_page = false                  # true = whole page as one long image

[post]
browser = "msedge"
media = true                       # also download the post's images / videos (when public)
page_screenshot = false            # also screenshot the original page (X / Instagram often show a login wall)

# One section per connector. Add a file in code/connectors/ + a section here.
# Remove: delete the file, or set enabled = false.
[connectors.ddg]
enabled = true

[connectors.wikimedia]
enabled = true

[connectors.openverse]
enabled = true

[connectors.youtube]
enabled = true

[connectors.internet_archive]
enabled = true

[connectors.wikidata]
enabled = true

[connectors.simple_icons]
enabled = true

[connectors.web]
enabled = true

# --- social posts (--posts N) ---
[connectors.social_search]         # '<query> site:x.com' etc. on DuckDuckGo
enabled = true

[connectors.news_embeds]           # posts embedded inside news articles about the query
enabled = true

[connectors.reddit]                # Reddit search RSS
enabled = true

[connectors.mastodon]
enabled = true
instance = "mastodon.social"

[connectors.logged_in]             # live X search + Instagram tags; only after `collect.py --login`
enabled = true                     # (dummy account, your risk: automated use is against their terms)

[connectors.telegram]              # public channels to search, by username (t.me/<username>)
enabled = true
channels = []                      # e.g. ["durov"]; add news channels you trust

